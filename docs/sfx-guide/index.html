<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Everaris — Guía Visual de Clips SFX</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar" aria-label="Navegación de tareas">
      <div class="brand">
        <span class="brand-kicker">Everaris · Audio</span>
        <h1>Guía de Clips SFX</h1>
        <p class="brand-subtitle">Referencias visuales y briefs auditados de HacknPlan (<code>US-85</code> / <code>US-86</code>).</p>
      </div>

      <div class="sidebar-stats" id="sidebarStats"></div>

      <nav class="task-nav" id="taskNav"></nav>

      <div class="sidebar-footer">
        <p>Carpeta de GIFs: <code>docs/sfx-guide/gifs/</code></p>
        <p class="muted">El progreso local de revisión se guarda en este navegador.</p>
      </div>
    </aside>

    <main class="main-content">
      <header class="toolbar">
        <div class="search-wrap">
          <label class="sr-only" for="searchInput">Buscar clips o descripciones</label>
          <input
            id="searchInput"
            type="search"
            placeholder="Buscar arma, habilidad, enemigo, ítem o archivo .gif..."
            autocomplete="off"
          />
        </div>

        <div class="filter-group" role="group" aria-label="Filtrar por historia">
          <button type="button" class="chip active" data-story="all">Todas</button>
          <button type="button" class="chip" data-story="US-85">US-85</button>
          <button type="button" class="chip" data-story="US-86">US-86</button>
        </div>

        <div class="filter-group" role="group" aria-label="Filtrar por estado de GIF">
          <button type="button" class="chip active" data-media="all">Todos</button>
          <button type="button" class="chip" data-media="loaded">Con GIF</button>
          <button type="button" class="chip" data-media="missing">Falta GIF</button>
        </div>
      </header>

      <section class="stories-strip" id="storiesStrip" aria-label="Resumen de historias madre"></section>

      <section class="sections-container" id="sectionsContainer"></section>
    </main>
  </div>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-labelledby="lightboxTitle">
    <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
    <div class="lightbox-panel">
      <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Cerrar vista ampliada">✕</button>
      <img id="lightboxImage" alt="" />
      <div class="lightbox-caption">
        <h3 id="lightboxTitle"></h3>
        <p id="lightboxMeta"></p>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
